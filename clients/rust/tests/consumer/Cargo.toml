[package]
name = "talon-sdk-error-api-consumer"
version = "0.0.0"
edition = "2021"
publish = false

# An independent workspace prevents the SDK's own dependencies from masking
# missing public exports. This must remain the only direct dependency.
[workspace]

[dependencies]
talon-rust-client = { path = "../.." }

# Patches do not propagate from a dependency's workspace. Use the same
# prepared Monoio source as the root workspace, including in offline CI.
[patch.crates-io]
monoio = { path = "../../../../.patched-deps/monoio" }

[[test]]
name = "public_error_api"
path = "../public_error_api.rs"
