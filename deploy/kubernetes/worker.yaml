# Persistent Worker slots. Each ordinal reopens its retained cache PVC and
# worker_identity. See docs/how-to/rolling-upgrade.md before migrating a Deployment.
# Provision matching PVs or change storageClassName to your persistent class.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: talon-worker
  namespace: talon
  labels:
    app.kubernetes.io/name: talon
    app.kubernetes.io/component: worker
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: talon-worker
  namespace: talon
  labels:
    app.kubernetes.io/name: talon
    app.kubernetes.io/component: worker
spec:
  replicas: 3
  serviceName: talon-worker
  podManagementPolicy: OrderedReady
  minReadySeconds: 15
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: talon
      app.kubernetes.io/component: worker
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: talon
        app.kubernetes.io/component: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: talon-worker
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: talon
              app.kubernetes.io/component: worker
        # Zone-aware cache reads (ADR 0006) rely on every zone having
        # workers; DoNotSchedule keeps the per-zone capacity balanced.
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: talon
              app.kubernetes.io/component: worker
      containers:
        - name: worker
          image: ghcr.io/milvus-io/talon-worker:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--coordinator"
            - "talon-coordinator:7000"
            - "--listen"
            - "0.0.0.0:7001"
            - "--admin-listen"
            - "0.0.0.0:8001"
          ports:
            - name: data
              containerPort: 7001
            - name: admin
              containerPort: 8001
          env:
            - name: TALON_WORKER_CLUSTER_ID
              value: "talon"
            # Lets the worker look up its node's zone label for zone-aware
            # cache reads (ADR 0006); requires the talon-node-zone-reader
            # ClusterRole in rbac.yaml. TALON_ZONE overrides the lookup.
            - name: TALON_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Advertise the pod IP so the coordinator routes peers to this pod.
            - name: TALON_WORKER_ADVERTISE_ADDR
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: TALON_WORKER_CACHE_DIRS
              value: /var/cache/talon
            # Cache capacity the worker is allowed to fill (8 GiB). Keep this
            # below the emptyDir/PVC size and the container memory limit.
            - name: TALON_WORKER_CAPACITY_BYTES
              value: "8589934592"
            # Optional L1 DRAM cache. Keep disabled unless the pod memory limit
            # includes this capacity plus the worker's normal heap/runtime use.
            - name: TALON_WORKER_L1_CAPACITY_BYTES
              value: "0"
            - name: TALON_WORKER_L1_PAGE_SIZE_BYTES
              value: "262144"
            # Object-store backend credentials from the Secret — never logged.
            - name: TALON_WORKER_AZURE_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: talon-worker-backend
                  key: azure-account
            - name: TALON_WORKER_AZURE_SAS
              valueFrom:
                secretKeyRef:
                  name: talon-worker-backend
                  key: azure-sas
          volumeMounts:
            - name: cache
              mountPath: /var/cache/talon
          startupProbe:
            httpGet: { path: /healthz, port: admin }
            failureThreshold: 300
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: admin }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: admin }
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
  volumeClaimTemplates:
    - metadata:
        name: cache
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: talon-local
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: talon-worker
  namespace: talon
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: talon
    app.kubernetes.io/component: worker
  ports:
    - name: data
      port: 7001
      targetPort: data
