# Least-privilege RBAC for the Talon coordinator's Kubernetes ClusterStateStore
# backend (feature "kubernetes").
#
# The backend stores process Leases and the persistent membership ConfigMap in
# one namespace. The state Role grants no cluster-wide or Secret access. Bind it
# to the ServiceAccount the coordinator pods run as.
#
# Apply into the namespace that holds Talon state (KubernetesConfig.namespace):
#   kubectl apply -n talon -f rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: talon-coordinator
  namespace: talon
  labels:
    app.kubernetes.io/name: talon
    app.kubernetes.io/component: coordinator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: talon-coordinator-state
  namespace: talon
  labels:
    app.kubernetes.io/name: talon
    app.kubernetes.io/component: coordinator
rules:
  # Manage Lease objects only in this namespace. get/list/watch back
  # snapshots and event streams; create/update/patch back heartbeat upserts;
  # delete backs graceful node removal. No access to secrets, pods, or any
  # cluster-scoped resource.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    # Persistent registry CAS; deliberately no delete permission.
    resources: ["configmaps"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: talon-coordinator-state
  namespace: talon
  labels:
    app.kubernetes.io/name: talon
    app.kubernetes.io/component: coordinator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: talon-coordinator-state
subjects:
  - kind: ServiceAccount
    name: talon-coordinator
    namespace: talon
---
# Zone-aware cache reads (ADR 0006): workers and gateways resolve their own
# deployment zone by reading their node's `topology.kubernetes.io/zone` label.
# Nodes are cluster-scoped, so this is a ClusterRole; it grants read access to
# node objects only. Skip it entirely by injecting TALON_ZONE instead.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: talon-node-zone-reader
  labels:
    app.kubernetes.io/name: talon
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: talon-node-zone-reader
  labels:
    app.kubernetes.io/name: talon
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: talon-node-zone-reader
subjects:
  # Bind every ServiceAccount that runs a talon-worker or a zone-affine
  # gateway; extend the list to match your deployment.
  - kind: ServiceAccount
    name: talon-worker
    namespace: talon
