# Isolated development stack; does not alter the existing Prometheus deployment.
services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: [--config=/etc/otel/config.yaml]
    volumes: ["./collector.yaml:/etc/otel/config.yaml:ro"]
    ports: ["127.0.0.1:4318:4318"]
    mem_limit: 384m
  tempo:
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./tempo.yaml:/etc/tempo.yaml:ro"]
    ports: ["127.0.0.1:3200:3200"]
    mem_limit: 512m
