{{- if .Values.worker.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    {{- include "talon.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    {{- include "talon.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  serviceName: {{ .Release.Name }}-worker
  podManagementPolicy: OrderedReady
  minReadySeconds: {{ .Values.worker.minReadySeconds }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "talon.selectorLabels" (dict "component" "worker") | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: {{ .Values.worker.rollingUpdate.partition }}
  template:
    metadata:
      labels:
        {{- include "talon.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ .Release.Name }}-worker
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: {{ .Values.worker.topologySpreadWhenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "talon.selectorLabels" (dict "component" "worker") | nindent 14 }}
      {{- if not .Values.worker.persistence.enabled }}
      volumes:
        - name: cache
          emptyDir: {}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "talon.workerImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--coordinator"
            - "{{ .Release.Name }}-coordinator:7000"
            - "--listen"
            - "0.0.0.0:7001"
            - "--admin-listen"
            - "0.0.0.0:8001"
          ports:
            - name: data
              containerPort: 7001
            - name: admin
              containerPort: 8001
          env:
            - name: TALON_WORKER_CLUSTER_ID
              value: {{ .Values.coordinator.clusterId | quote }}
            - name: TALON_WORKER_ADVERTISE_ADDR
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: TALON_WORKER_CACHE_DIRS
              value: /var/cache/talon
            - name: TALON_WORKER_BLOCK_SIZE
              value: {{ .Values.worker.blockSizeBytes | quote }}
            - name: TALON_WORKER_CAPACITY_BYTES
              value: {{ .Values.worker.capacityBytes | quote }}
            - name: TALON_WORKER_L1_CAPACITY_BYTES
              value: {{ .Values.worker.l1CapacityBytes | quote }}
            - name: TALON_WORKER_L1_PAGE_SIZE_BYTES
              value: {{ .Values.worker.l1PageSizeBytes | quote }}
            - name: TALON_WORKER_AZURE_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.worker.backend.existingSecret }}
                  key: {{ .Values.worker.backend.azureAccountKey }}
            - name: TALON_WORKER_AZURE_SAS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.worker.backend.existingSecret }}
                  key: {{ .Values.worker.backend.azureSasKey }}
          volumeMounts:
            - name: cache
              mountPath: /var/cache/talon
          startupProbe:
            httpGet: { path: /healthz, port: admin }
            failureThreshold: 300
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: admin }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: admin }
            periodSeconds: 5
            failureThreshold: 2
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
  {{- if .Values.worker.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: cache
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.worker.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.worker.persistence.size }}
  {{- end }}
---
# Governing service only; discovered data endpoints remain individual Pod IPs.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    {{- include "talon.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "talon.selectorLabels" (dict "component" "worker") | nindent 4 }}
  ports:
    - name: data
      port: 7001
      targetPort: data
{{- end }}
