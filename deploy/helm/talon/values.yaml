# Default values for the Talon chart.
#
# One release is one cluster, and a cluster runs one placement ring
# (ADR 0006). `coordinator.clusterType` picks which, and the enabled worker
# must match it — a block cluster refuses to register an async worker and vice
# versa. Serving both means installing the chart twice, once per type, not
# enabling both worker blocks in one release. The chart fails the render rather
# than let that ship.
#
# The most important choice after that is the coordinator state backend:
#   memory     — single replica, no HA (dev/demo only)
#   kubernetes — Lease backend, no external datastore (adds RBAC)
#   etcd       — external etcd, credentials from a Secret
# See values.schema.json for the full contract.

# -- Image registry/repository/tag applied to every component. The tag defaults
# to the chart appVersion when left empty.
image:
  registry: ghcr.io/milvus-io
  # Per-component repository names appended to the registry.
  coordinator: talon-coordinator
  worker: talon-worker
  asyncWorker: talon-async-worker
  tag: ""
  pullPolicy: IfNotPresent

# -- Extra labels merged onto every rendered object.
commonLabels: {}

coordinator:
  # -- State backend: memory | kubernetes | etcd.
  backend: kubernetes
  # -- Which placement ring this cluster runs: block | async. `block` admits
  # `talon-worker` and caches 256MiB blocks; `async` admits
  # `talon-async-worker` and caches the exact byte ranges asked for. Fixed for
  # the life of the coordinator; changing it is a new cluster, not an upgrade.
  clusterType: block
  clusterId: talon
  # -- Coordinator replica count. Forced to 1 for the memory backend (no HA).
  replicas: 3
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # -- etcd backend settings. endpoints/credentials/TLS come from a Secret you
  # create out-of-band (see deploy/kubernetes/etcd-secret.example.yaml); set the
  # name here. Leave existingSecret empty for memory/kubernetes backends.
  etcd:
    existingSecret: talon-etcd
    # Keys within the Secret.
    endpointsKey: endpoints
    usernameKey: username
    passwordKey: password
    # Mounted TLS material (optional). Set to false for a plaintext etcd.
    tls:
      enabled: true
      caKey: ca.crt
      certKey: client.crt
      keyKey: client.key
  # -- Optional management API/UI bearer token from an existing Secret.
  auth:
    existingSecret: ""
    tokenKey: token

# Block workers. Requires coordinator.clusterType=block.
worker:
  # -- Deploy cache workers alongside the coordinator.
  enabled: true
  replicas: 3
  # -- Scheduler behavior when workers cannot be evenly spread across nodes.
  topologySpreadWhenUnsatisfiable: ScheduleAnyway
  # -- Cache block size in bytes. Capacity must be at least one block.
  blockSizeBytes: 268435456
  # -- Cache capacity in bytes the worker is allowed to fill.
  capacityBytes: 8589934592
  # -- L1 DRAM cache capacity in bytes. Zero keeps L1 disabled.
  l1CapacityBytes: 0
  # -- Fixed L1 DRAM page size.
  l1PageSizeBytes: 262144
  # -- Object-store credentials. Reference a Secret you create out-of-band (see
  # deploy/kubernetes/worker-secret.example.yaml).
  backend:
    existingSecret: talon-worker-backend
    azureAccountKey: azure-account
    azureSasKey: azure-sas
  # -- Cache volume. When persistence is disabled an emptyDir is used.
  persistence:
    enabled: false
    size: 20Gi
    storageClass: ""
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi

# Async workers, caching variable-length extents instead of fixed blocks.
# Requires coordinator.clusterType=async. Read-only: writes and directory
# listings are refused, so a deployment needing those wants a block cluster.
asyncWorker:
  # -- Deploy async workers alongside the coordinator. Off by default, since
  # the default cluster type is block.
  enabled: false
  replicas: 3
  # -- Scheduler behavior when workers cannot be evenly spread across nodes.
  topologySpreadWhenUnsatisfiable: ScheduleAnyway
  # -- NVMe tier ceiling in bytes.
  capacityBytes: 8589934592
  # -- L1 DRAM cache capacity in bytes. Zero keeps L1 disabled.
  l1CapacityBytes: 0
  # -- Bytes written between NVMe checkpoints. Zero disables warm restart, and
  # the cache directory is wiped at startup instead of recovered (ADR 0005 §7).
  checkpointIntervalBytes: 268435456
  # -- Object-store credentials. Reference a Secret you create out-of-band (see
  # deploy/kubernetes/worker-secret.example.yaml); the same shape as the block
  # worker's, read under TALON_ASYNC_WORKER_* names.
  backend:
    existingSecret: talon-worker-backend
    azureAccountKey: azure-account
    azureSasKey: azure-sas
  # -- Cache volume. When persistence is disabled an emptyDir is used, which
  # also means warm restart has nothing to recover from.
  persistence:
    enabled: false
    size: 20Gi
    storageClass: ""
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi

service:
  type: ClusterIP

# -- PodDisruptionBudget for the coordinator (HA backends only).
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# -- Prometheus Operator ServiceMonitor. Requires the monitoring.coreos.com CRDs.
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
