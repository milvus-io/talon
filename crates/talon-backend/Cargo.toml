[package]
name = "talon-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Blob-store BackendStore implementations (S3/GCS/Azure) for Talon"

[dependencies]
talon-uring = { workspace = true, optional = true }
monoio = { workspace = true, optional = true }
monoio-codec = { version = "=0.3.4", optional = true }
libc = { workspace = true, optional = true }
monoio-http = { version = "=0.3.12", optional = true }
rustls = { workspace = true, optional = true }
zeroize = { version = "1", optional = true }
webpki-roots = { version = "0.26", optional = true }
http = { version = "1", optional = true }
talon-telemetry.workspace = true
talon-core.workspace = true
# GCS answers listings with JSON (S3 and Azure use XML).
serde_json.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
tokio-util.workspace = true
url.workspace = true
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
opentelemetry = { version = "=0.28.0", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "=0.28.0", default-features = false, features = ["trace"] }
tracing-opentelemetry = { version = "=0.29.0", default-features = false }
tracing-subscriber.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }

[features]
uring = ["dep:monoio-codec", "dep:libc", "dep:talon-uring", "dep:monoio", "dep:monoio-http", "dep:rustls", "dep:zeroize", "dep:webpki-roots", "dep:http"]
telemetry = ["talon-telemetry/export"]
