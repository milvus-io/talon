[package]
name = "talon-telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
recording = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:tracing-opentelemetry"]
export = ["recording", "dep:opentelemetry-otlp"]

[dependencies]
tracing.workspace = true
tracing-subscriber.workspace = true
pin-project-lite = "0.2"
scoped-tls = "1"
opentelemetry = { version = "=0.28.0", default-features = false, features = ["trace"], optional = true }
opentelemetry_sdk = { version = "=0.28.0", default-features = false, features = ["trace"], optional = true }
tracing-opentelemetry = { version = "=0.29.0", default-features = false, optional = true }
opentelemetry-otlp = { version = "=0.28.0", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client", "reqwest-rustls"], optional = true }

[dev-dependencies]
tokio.workspace = true
