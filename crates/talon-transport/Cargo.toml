[package]
name = "talon-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Emits the wire-protocol conformance vectors (#311) that every client asserts
# against. Generated, never hand-written: a test fails if the wire changes.
[[bin]]
name = "talon-gen-conformance-vectors"
path = "src/bin/gen-conformance-vectors.rs"

[dependencies]
anyhow.workspace = true
talon-core.workspace = true
thiserror.workspace = true
serde.workspace = true
bincode.workspace = true
tokio.workspace = true
tracing.workspace = true
monoio.workspace = true

[dev-dependencies]
serde_json.workspace = true
