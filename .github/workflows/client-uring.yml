name: native SDK io_uring

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/client-uring.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'patches/**'
      - 'scripts/prepare_monoio.py'
      - 'scripts/test_client_no_uring.py'
      - 'crates/talon-cache-client/**'
      - 'crates/talon-transport/**'
      - 'clients/rust/**'
      - 'clients/c/**'
      - 'clients/python/**'

permissions:
  contents: read

jobs:
  native-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TALON_CLIENT_IO_THREADS: 2
      RUSTFLAGS: -Dwarnings
      RUSTDOCFLAGS: -Dwarnings
      NO_PROXY: 127.0.0.1,localhost,::1
      no_proxy: 127.0.0.1,localhost,::1
    steps:
      - uses: actions/checkout@v4
      - name: Prepare patched Monoio
        run: python3 scripts/prepare_monoio.py
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - name: Require real native RPC execution
        # These tests fail if the runner cannot create a ring; no silent fallback.
        run: |
          cargo test -p talon-cache-client --lib --all-features --locked monoio_client::receive_tests -- --ignored
          cargo test -p talon-cache-client --test native_rpc --all-features --locked -- --ignored
          cargo test -p talon-rust-client --test native_client --all-features --locked -- --ignored --skip hosted_auto_falls_back_when_ring_setup_is_denied
          cargo test -p talon-c --all-features --locked
          cargo test -p talon-c --all-features --locked native_c_entry -- --ignored
          cargo test -p talon-python --features telemetry --locked
          cargo test -p talon-python --features telemetry --locked native_python_entry -- --ignored
      - name: Verify denied-ring fallback in a separate process
        run: |
          cargo test -p talon-cache-client --lib --all-features --locked --no-run --message-format=json > target/client-tests.jsonl
          python3 scripts/test_client_no_uring.py --artifacts target/client-tests.jsonl
          cargo test -p talon-rust-client --test native_client --all-features --locked --no-run --message-format=json > target/hosted-tests.jsonl
          python3 scripts/test_client_no_uring.py --artifacts target/hosted-tests.jsonl --target native_client --test hosted_auto_falls_back_when_ring_setup_is_denied
          cargo test -p talon-c --all-features --locked --no-run --message-format=json > target/c-tests.jsonl
          python3 scripts/test_client_no_uring.py --artifacts target/c-tests.jsonl --target talon_c --test tests::async_read_invokes_inline_callback_and_fills_buffer
          cargo test -p talon-python --features telemetry --locked --no-run --message-format=json > target/python-tests.jsonl
          python3 scripts/test_client_no_uring.py --artifacts target/python-tests.jsonl --target talon --test tests::concurrent_python_stats_release_gil_and_share_hosted_client
